version: '3.8'
services:
  backend:
    build: ./backend
    container_name: inventaris-backend
    network_mode: host
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3000
      - NODE_ENV=production
    restart: always

  frontend:
    build: ./frontend
    container_name: inventaris-frontend
    network_mode: host
    volumes:
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
    restart: always
